[package]
name = "skadmin"
version = "0.1.0"
edition = "2021"
authors = ["Arsam Kazempour <ysekka1386@proton.me>"]
description = "An administration cli application for skarticle systems"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.2.0", features = ["derive"] }
env_logger = "0.10.0"
http = "0.2.9"
jsonwebtoken = "8.3.0"
lazy_static = "1.4.0"
log = "0.4.17"
reqwest = { version = "0.11.16", features = ["blocking"] }
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.95"
toml = "0.7.3"
url = { version = "2.3.1", features = ["serde"] }
uuid = { version = "1.3.0", features = ["serde"] }
common = { path = "../common" }
exitcode = "1.1.2"
entity = { path = "../database/entity" }